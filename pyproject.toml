[tool.poetry]
name = "campus-model"
version = "0.1.0"
description = "Campus domain models: dataclass entities under campus/model - PEP 420 namespace portion"
authors = ["Ng Jun Siang <ngjunsiang@gmail.com>"]
readme = "README.md"
packages = [{include = "campus/model", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11.0,<3.15"
# Models reference common schema types (CampusID, DateTime, ...); the
# wheel URL pins the same release every consumer relocks to.
campus-common = {url = "https://github.com/nyjc-computing/campus-common/releases/download/v0.2.1/campus_common-0.2.1-py3-none-any.whl"}

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.9"
pyright = "^1.1.391"

[tool.pyright]
include = ["src", "tests"]
useLibraryCodeForTypes = true
venvPath = "."
venv = ".venv"
stubPath = ""
exclude = ["**/__pycache__", ".venv"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'SIM']
# Policy (mirrors the campus monorepo): ruff enforces style; humans rewrite
# code. Autofixes are disabled repo-wide (see campus docs/STYLE-GUIDE.md).
fixable = []
ignore = [
    'W291', 'W292', 'W293',  # trailing whitespace: formatting, not lint
]

[tool.ruff.lint.per-file-ignores]
# scripts/ bootstraps sys.path before importing campus - intentional.
"scripts/*" = ['E402']

[tool.ruff.lint.isort]
# Cross-repo namespace (#987 lesson): without this pin, ruff's src-based
# detection classifies campus.common third-party while campus.model is
# first-party, splitting their imports into separate sections (~8 I001s
# in the carved tests).
known-first-party = ["campus"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
